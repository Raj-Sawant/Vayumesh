services:
  - type: web
    name: vayumesh-viewer
    runtime: python
    plan: standard
    region: singapore
    buildCommand: pip install -r requirements_render.txt
    startCommand: python viewer_render.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VAYUMESH_VIEWER_ONLY
        value: "true"
      - key: RENDER
        value: "true"
