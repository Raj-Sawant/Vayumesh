# VayuMesh Fine-tuning Config for UAVFF3D Dataset
# Based on VGGT training framework
# Run with: python training/launch.py --config configs/uavff3d_finetune.yaml

defaults:
  - /training/base_config
  - _self_

# Experiment settings
experiment:
  name: "vayumesh_uavff3d_finetune"
  log_dir: "./logs/uavff3d_finetune"
  save_dir: "./checkpoints/uavff3d_finetune"
  resume_checkpoint_path: null  # Set to pretrained VGGT path for initialization

# Model configuration - VGGT with fine-tuning
model:
  _target_: vggt.models.vggt.VGGT
  # Load pretrained weights
  pretrained_path: "https://huggingface.co/facebook/VGGT-1B/resolve/main/model.pt"
  # Freeze aggregator initially, only fine-tune heads
  freeze_aggregator: false
  freeze_camera_head: false
  freeze_depth_head: false
  freeze_point_head: false

# Training hyperparameters (from UAVFF3D paper)
training:
  max_epochs: 50
  batch_size: 4  # Per GPU, adjust based on VRAM
  accum_steps: 4  # Effective batch = batch_size * accum_steps * num_gpus
  seed_value: 42
  val_epoch_freq: 1
  limit_train_batches: null
  limit_val_batches: null

# Optimizer (UAVFF3D uses lower LR for fine-tuning)
optim:
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-5  # Lower LR for fine-tuning (UAVFF3D paper)
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1e-8
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: 50
    eta_min: 1e-7
  amp:
    enabled: true
    amp_dtype: "bfloat16"
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_names: ["*"]
        max_norm: 1.0
        norm_type: 2
  frozen_module_names: []  # Unfreeze all for full fine-tuning

# Loss configuration (matching UAVFF3D training)
loss:
  _target_: training.loss.MultitaskLoss
  camera:
    weight: 1.0
    loss_type: "l1"
    gamma: 0.6
    pose_encoding_type: "absT_quaR_FoV"
    weight_trans: 1.0
    weight_rot: 1.0
    weight_focal: 0.5
  depth:
    weight: 1.0
    gamma: 1.0
    alpha: 0.2
    gradient_loss_fn: "grad_conf"
    valid_range: 0.99
  point:
    weight: 1.0
    gamma: 1.0
    alpha: 0.2
    gradient_loss_fn: "normal_conf"
    valid_range: 0.99

# UAVFF3D Dataset Configuration
data:
  train:
    _target_: training.data.uavff3d.UAVFF3DDataset
    data_root: "/data/uavff3d"  # UPDATE THIS PATH
    split: "train"
    image_size: [518, 518]
    num_frames: 8
    frame_sampler:
      _target_: training.data.track_util.UniformFrameSampler
      num_frames: 8
      max_skip: 5
    augment:
      color_jitter: 0.2
      random_crop: true
      horizontal_flip: true
    load_depth: true
    load_pose: true
    load_point_cloud: true
    normalize_scale: true  # Normalize to metric scale using LiDAR
  
  val:
    _target_: training.data.uavff3d.UAVFF3DDataset
    data_root: "/data/uavff3d"  # UPDATE THIS PATH
    split: "val"
    image_size: [518, 518]
    num_frames: 8
    frame_sampler:
      _target_: training.data.track_util.UniformFrameSampler
      num_frames: 8
      max_skip: 5
    augment:
      color_jitter: 0.0
      random_crop: false
      horizontal_flip: false
    load_depth: true
    load_pose: true
    load_point_cloud: true
    normalize_scale: true

# Logging
logging:
  log_dir: "./logs/uavff3d_finetune"
  log_level_primary: "INFO"
  log_level_secondary: "DEBUG"
  all_ranks: false
  log_freq: 100
  log_visuals: true
  log_visual_frequency:
    train: 500
    val: 100
  visuals_keys_to_log:
    train:
      keys_to_log: ["images", "depth", "world_points", "depth_conf", "world_points_conf"]
      modality: "image"
    val:
      keys_to_log: ["images", "depth", "world_points", "depth_conf", "world_points_conf"]
      modality: "image"
  video_logging_fps: 5
  scalar_keys_to_log:
    train:
      keys_to_log: ["loss_camera", "loss_T", "loss_R", "loss_FL", 
                    "loss_conf_depth", "loss_reg_depth", "loss_grad_depth",
                    "loss_conf_point", "loss_reg_point", "loss_grad_point",
                    "objective"]
    val:
      keys_to_log: ["loss_camera", "loss_T", "loss_R", "loss_FL",
                    "loss_conf_depth", "loss_reg_depth", "loss_grad_depth",
                    "loss_conf_point", "loss_reg_point", "loss_grad_point",
                    "objective"]

# Checkpointing
checkpoint:
  save_dir: "./checkpoints/uavff3d_finetune"
  save_freq: 5
  strict: true
  resume_checkpoint_path: null

# Distributed training
distributed:
  backend: "nccl"
  timeout_mins: 30
  find_unused_parameters: true
  gradient_as_bucket_view: true
  bucket_cap_mb: 25
  broadcast_buffers: false

# CUDA settings
cuda:
  cudnn_deterministic: false
  cudnn_benchmark: true
  allow_tf32: true

# Environment variables
env_variables:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  MKL_THREADING_LAYER: "GNU"
  NCCL_ASYNC_ERROR_HANDLING: "1"